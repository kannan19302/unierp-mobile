services:
  unierp-mobile:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    container_name: unierp-mobile
    ports:
      - "4009:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
      - API_URL=http://localhost:3001
      - IDP_URL=http://localhost:3005
    volumes:
      - ./web:/app/web
      - ./server.mjs:/app/server.mjs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
