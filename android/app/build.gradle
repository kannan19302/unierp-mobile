plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.unerp.mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // UniERP's mobile bundle id — keep in sync with ios/Runner/Info.plist.
        applicationId "com.unerp.mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        // flutter_appauth generates its RedirectUriReceiverActivity's
        // intent-filter from this placeholder — must match Env.oidcRedirectUri
        // ('unierp://auth/callback') and the redirect URI registered for the
        // unierp-mobile OIDC client in data/prisma/seed-oidc-clients.ts.
        manifestPlaceholders += [appAuthRedirectScheme: "unierp"]
    }

    buildTypes {
        release {
            // TODO(release): wire a real signing config before shipping to
            // Play — debug signing is a placeholder so `flutter build` works
            // out of the box for local verification only.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
